<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chanithu Liyanage | Digital CV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef1f5;font-family:Arial,Helvetica,sans-serif;color:#1f2937}
.cv{max-width:960px;margin:28px auto;background:#fff;box-shadow:0 12px 35px rgba(0,0,0,.10);border-radius:14px;overflow:hidden}
.header{padding:34px 40px;background:#172033;color:#fff;display:flex;align-items:center;gap:28px}
.photo-wrap{position:relative;width:145px;height:145px;flex:none}
.photo{width:145px;height:145px;object-fit:cover;object-position:center top;border-radius:50%;background:#fff;cursor:pointer;opacity:0;animation:photoReveal 0.8s ease-out 0.7s forwards;}
@keyframes photoReveal{
  from{opacity:0;transform:scale(0.85);}
  to{opacity:1;transform:scale(1);}
}
.photo-frame{position:absolute;top:0;left:0;width:145px;height:145px;border:4px solid #fff;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.25);pointer-events:none;animation:frameRun 1.4s ease-out forwards;}
@keyframes frameRun{
  0%{opacity:0;transform:translateX(-280px) scale(0.9);}
  20%{opacity:1;}
  70%{transform:translateX(15px) scale(1.05);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.photo:hover{transform:scale(1.05)}
.headtext{flex:1}
.header h1{margin:0 0 7px;font-size:36px;animation:nameFly 1.4s ease-out forwards}
@keyframes nameFly{
  0%{opacity:0;transform:translateX(-220px) scale(0.2);}
  70%{opacity:1;transform:translateX(15px) scale(1.05);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.header .role{font-size:16px;color:#d7deea;margin-bottom:18px;opacity:0;animation:roleIn 0.8s ease-out 0.5s forwards}
@keyframes roleIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
.contact{display:flex;flex-wrap:wrap;gap:9px}
.contact a{color:#fff;text-decoration:none;background:rgba(255,255,255,.10);padding:9px 11px;border-radius:8px;font-size:13px;transition:transform 0.2s ease;opacity:0;animation:fadeIn 0.6s ease-out forwards;}
.contact a:nth-child(1){animation-delay:0.9s;}
.contact a:nth-child(2){animation-delay:1.1s;}
.contact a:nth-child(3){animation-delay:1.3s;}
@keyframes fadeIn{
  to{opacity:1;}
}
.contact a:hover{transform:scale(1.08);}
.main{display:grid;grid-template-columns:280px 1fr}
.sidebar{padding:30px 25px;background:#f7f8fa;border-right:1px solid #e5e7eb}
.content{padding:30px 38px}
section{margin-bottom:28px}
h2{font-size:16px;text-transform:uppercase;letter-spacing:1.4px;margin:0 0 14px;color:#172033}
p{line-height:1.6;margin:0 0 10px}
ul{margin:0;padding-left:19px}
li{margin:7px 0;line-height:1.5}
.edu{margin-bottom:21px}
.edu h3{font-size:16px;margin:0 0 5px}
.badge{display:inline-block;background:#e9edf3;padding:6px 8px;border-radius:6px;margin:3px 3px 3px 0;font-size:12px;transition:all 0.25s ease;cursor:pointer;opacity:0;animation:badgeFly 1s ease-out forwards;}
@keyframes badgeFly{
  0%{opacity:0;transform:translateX(-200px) scale(0.3);}
  60%{opacity:1;transform:translateX(12px) scale(1.05);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.badge:nth-of-type(1){animation-delay:0.8s;}
.badge:nth-of-type(2){animation-delay:1.0s;}
.badge:nth-of-type(3){animation-delay:1.2s;}
.badge:nth-of-type(4){animation-delay:1.4s;}
.badge:nth-of-type(5){animation-delay:1.6s;}
.badge:nth-of-type(6){animation-delay:1.8s;}
.badge:nth-of-type(7){animation-delay:2.0s;}
.badge:nth-of-type(8){animation-delay:2.2s;}
.badge:hover{background:#dbeafe;transform:translateY(-3px) scale(1.05);box-shadow:0 6px 12px rgba(23,32,51,.20);}
.socials{display:flex;flex-direction:column;gap:9px}
.socials a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#172033;padding:9px;border-radius:8px;background:#fff;border:1px solid #e5e7eb;transition:all 0.25s ease;cursor:pointer;opacity:0;animation:contactFly 1s ease-out forwards;}
.socials a:hover{background:#dbeafe;color:#172033;transform:translateY(-2px);box-shadow:0 6px 15px rgba(23,32,51,.25)}
.socials a:hover .icon{background:#fff;color:#172033}
.icon{width:29px;height:29px;display:grid;place-items:center;border-radius:7px;background:#172033;color:#fff;font-size:12px;font-weight:bold}
.note{font-size:12px;color:#6b7280}
.edu-logo{transition:transform 0.25s ease;cursor:pointer;opacity:0;animation:logoFly 1s ease-out forwards;}
@keyframes logoFly{
  0%{opacity:0;transform:translateX(180px) scale(0.2);}
  70%{opacity:1;transform:translateX(-10px) scale(1.08);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.logo1{animation-delay:2.2s;}
.logo2{animation-delay:2.5s;}
.logo3{animation-delay:2.8s;}
.edu-logo:hover{animation:none;transform:scale(1.18);opacity:1;}
.view-btn{display:inline-flex;align-items:center;gap:6px;color:#2563eb !important;background:#eff6ff;border:1px solid #dbeafe;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:bold;text-decoration:none;opacity:0;animation:fadeIn 0.6s ease-out forwards;transition:transform 0.2s ease;}
.view-btn:visited{color:#2563eb !important;}
.view-btn:hover{transform:scale(1.05);background:#dbeafe;}
.view-btn.delay1{animation-delay:1.6s;}
.view-btn.delay2{animation-delay:1.9s;}
@media(max-width:700px){ .header{padding:26px 22px} .main{grid-template-columns:1fr} .sidebar{border-bottom:1px solid #e5e7eb} .content{padding:28px 24px} }
.lang-box{display:flex;flex-direction:column;gap:16px}
.lang-top{display:flex;justify-content:space-between;font-size:13px;font-weight:bold;margin-bottom:6px;color:#172033}
.lang-bar{height:10px;background:#e9edf3;border-radius:20px;overflow:hidden}
.lang-fill{height:100%;width:0;border-radius:20px;transition:width 1.2s ease-out}
.lang-fill.sinhala{background:linear-gradient(90deg,#f59e0b,#ef4444)}
.lang-fill.english{background:linear-gradient(90deg,#2563eb,#06b6d4)}
.lang-box.animate .lang-fill{width:var(--w)}
#typeSummary{min-height:78px}
#typeSummary::after{content:'|';color:#172033;font-weight:bold;animation:blink 0.7s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes contactFly{
  0%{opacity:0;transform:translateX(-200px) scale(0.3);}
  60%{opacity:1;transform:translateX(12px) scale(1.05);}
  100%{opacity:1;transform:translateX(0) scale(1);}
}
.socials a{
  opacity:0;
  animation:contactFly 1s ease-out forwards;
}
.socials a:nth-child(1){animation-delay:0.8s;}
.socials a:nth-child(2){animation-delay:1.1s;}
.socials a:nth-child(3){animation-delay:1.4s;}
.grade{font-weight:800;color:#1f2937;}
</style>
</head>
<body>
<div class="cv">
<header class="header">
  <div class="photo-wrap">
  <a href="photo.jpg.png" target="_blank
